name: CI/CD APP (Build e Deploy ECS Fargate)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY_NAME: teddy-app # Nome do Repositório ECR
      ECS_CLUSTER_NAME: teddy-cluster # Nome do Cluster ECS
      ECS_SERVICE_NAME: teddy-service # Nome do Serviço ECS
      ECS_TASK_DEFINITION_FAMILY: teddy-task # Nome da Família da Task Definition
      CONTAINER_NAME_IN_TASK: teddy-container # Nome do Container dentro da Task

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      # Configurar Credenciais AWS
      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login no Amazon ECR
      - name: Login no ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      
      # Build e Tag da imagem Docker
      - name: Build da Imagem Docker
        id: build-image
        run: |
          IMAGE_TAG=$(echo $GITHUB_SHA | cut -c 1-8)
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}
          docker build -t $ECR_REGISTRY:$IMAGE_TAG -f app/Dockerfile app
          docker tag $ECR_REGISTRY:$IMAGE_TAG $ECR_REGISTRY:latest

          echo "image-uri=$ECR_REGISTRY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Push da imagem para o ECR
      - name: Push para o ECR
        run: |
          docker push ${{ env.ECR_IMAGE }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}:latest

      - name: Task Definition
        id: task-def

        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/task-definition.json
          container-name: teddy-app-container
          image: ${{ steps.build-image.outputs.image-uri }}

      # Faz o Deploy do Serviço no Fargate
      - name: Deploy Amazon ECS Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          cluster: teddy-cluster
          service: teddy-service
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          wait-for-service-stability: true