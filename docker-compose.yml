version: "3.9"

services:
  app:
    build: ./app
    container_name: demo-new-relic-app
    environment:
      FLASK_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: YOUR_POSTGRES_PASSWORD
      NEW_RELIC_LICENSE_KEY: YOUR_NR_LICENSE_KEY
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  nginx:
    image: nginx:1.27
    container_name: demo-new-relic-nginx
    volumes:
      - ./app/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app

  postgres:
    image: postgres:15
    container_name: demo-new-relic-postgres
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: YOUR_POSTGRES_PASSWORD
      POSTGRES_DB: demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
